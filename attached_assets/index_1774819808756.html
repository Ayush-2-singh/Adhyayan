<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adhyayan Classes - Varanasi</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Lato:wght@400;600;700&family=Rajdhani:wght@600;700&family=Nunito:wght@400;600;700&display=swap"
    rel="stylesheet" />
  <style>
    /* ══════════════════════════════════════════
       HERO LANDING PAGE — Adhyayan Classes
    ══════════════════════════════════════════ */
    :root {
      --orange: #E8651A;
      --navy: #1B3D6E;
      --cream: #F5F0E8;
      --light-orange: #F4A460;
      --gold: #FFB347;
    }

    .ac-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: radial-gradient(ellipse at 60% 40%, #fff8f0 0%, var(--cream) 70%);
    }

    .ac-bg-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ac-particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      animation: acFloatParticle linear infinite;
    }

    @keyframes acFloatParticle {
      0% {
        transform: translateY(110vh) scale(0);
        opacity: 0;
      }

      10% {
        opacity: 0.08;
      }

      90% {
        opacity: 0.08;
      }

      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    .ac-book-scene {
      position: relative;
      width: 340px;
      height: 290px;
      margin-bottom: 30px;
      animation: acSceneEntry 1.2s cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes acSceneEntry {
      from {
        opacity: 0;
        transform: translateY(60px) scale(0.85);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .ac-book-svg {
      width: 340px;
      height: 220px;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .ac-page {
      transform-origin: center bottom;
      animation: acPageFlip 3s ease-in-out infinite;
    }

    .ac-page:nth-child(2) {
      animation-delay: 0.3s;
    }

    .ac-page:nth-child(3) {
      animation-delay: 0.6s;
    }

    .ac-page:nth-child(4) {
      animation-delay: 0.9s;
    }

    @keyframes acPageFlip {

      0%,
      40%,
      100% {
        transform: scaleX(1);
      }

      20% {
        transform: scaleX(1.06) scaleY(1.03);
      }
    }

    .ac-birds-container {
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 200px;
      pointer-events: none;
    }

    .ac-bird {
      position: absolute;
      opacity: 0;
      animation: acBirdFly 4s ease-out infinite;
    }

    .ac-bird:nth-child(1) {
      animation-delay: 0.5s;
      top: 30px;
      right: 20px;
    }

    .ac-bird:nth-child(2) {
      animation-delay: 1.0s;
      top: 10px;
      right: 60px;
    }

    .ac-bird:nth-child(3) {
      animation-delay: 1.5s;
      top: 50px;
      right: 0px;
    }

    @keyframes acBirdFly {
      0% {
        opacity: 0;
        transform: translate(0, 40px) scale(0.4) rotate(-10deg);
      }

      20% {
        opacity: 1;
      }

      60% {
        opacity: 0.9;
      }

      100% {
        opacity: 0;
        transform: translate(120px, -120px) scale(1.1) rotate(10deg);
      }
    }

    .ac-wing {
      animation: acWingFlap 0.4s ease-in-out infinite alternate;
      transform-origin: center;
    }

    @keyframes acWingFlap {
      from {
        transform: scaleY(1);
      }

      to {
        transform: scaleY(0.5);
      }
    }

    .ac-words-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ac-flying-word {
      position: absolute;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      color: var(--orange);
      opacity: 0;
      white-space: nowrap;
      animation: acWordFly 5s ease-out infinite;
      text-shadow: 0 2px 12px rgba(232, 101, 26, 0.3);
    }

    @keyframes acWordFly {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.5) rotate(var(--r));
      }

      15% {
        opacity: 1;
      }

      70% {
        opacity: 0.8;
      }

      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(calc(var(--r) + 15deg));
      }
    }

    .ac-logo-block {
      text-align: center;
      animation: acTextEntry 1.4s cubic-bezier(.22, 1, .36, 1) 0.3s both;
    }

    @keyframes acTextEntry {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ac-logo-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 700;
      color: var(--navy);
      letter-spacing: 0.04em;
      line-height: 1;
      position: relative;
      display: inline-block;
    }

    .ac-logo-name::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--orange), transparent);
      border-radius: 2px;
      animation: acSwooshGrow 1.5s ease 1s both;
    }

    @keyframes acSwooshGrow {
      from {
        width: 0;
        opacity: 0;
      }

      to {
        width: 80%;
        opacity: 1;
      }
    }

    .ac-logo-name .ac-highlight {
      color: var(--orange);
      position: relative;
    }

    .ac-logo-sub {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 600;
      color: var(--navy);
      letter-spacing: 0.35em;
      margin-top: 12px;
      opacity: 0.75;
      text-transform: uppercase;
    }

    .ac-star-accent {
      display: inline-block;
      color: var(--orange);
      font-size: 0.9em;
      animation: acStarSpin 4s linear infinite;
      transform-origin: center;
      margin-left: 4px;
    }

    @keyframes acStarSpin {

      0%,
      100% {
        transform: scale(1) rotate(0deg);
      }

      50% {
        transform: scale(1.4) rotate(180deg);
      }
    }

    .ac-tagline {
      margin-top: 28px;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--navy);
      opacity: 0.6;
      font-weight: 600;
      letter-spacing: 0.05em;
      animation: acTextEntry 1.6s cubic-bezier(.22, 1, .36, 1) 0.6s both;
    }

    .ac-cta-btn {
      margin-top: 36px;
      padding: 16px 48px;
      background: var(--orange);
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(232, 101, 26, 0.35);
      animation: acTextEntry 1.8s cubic-bezier(.22, 1, .36, 1) 0.8s both;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .ac-cta-btn:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 14px 40px rgba(232, 101, 26, 0.5);
      color: #fff;
    }

    .ac-cta-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, 0.25) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: acShimmer 2.5s ease 2s infinite;
    }

    @keyframes acShimmer {
      to {
        transform: translateX(200%);
      }
    }

    .ac-hero-stats {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 60px;
      animation: acTextEntry 2s cubic-bezier(.22, 1, .36, 1) 1s both;
    }

    .ac-stat-item {
      text-align: center;
    }

    .ac-stat-num {
      font-family: 'Rajdhani', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--orange);
      display: block;
    }

    .ac-stat-label {
      font-size: 0.75rem;
      color: var(--navy);
      opacity: 0.6;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .ac-stat-divider {
      width: 1px;
      background: var(--navy);
      opacity: 0.15;
      align-self: stretch;
    }

    .ac-glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: acOrbPulse 4s ease-in-out infinite;
    }

    .ac-glow-orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(232, 101, 26, 0.12);
      top: -100px;
      right: -100px;
    }

    .ac-glow-orb-2 {
      width: 300px;
      height: 300px;
      background: rgba(232, 101, 26, 0.08);
      bottom: 50px;
      left: -80px;
      animation-delay: 2s;
    }

    @keyframes acOrbPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.15);
        opacity: 0.7;
      }
    }

    .ac-burst-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3px solid var(--orange);
      opacity: 0;
      animation: acBurstRing 1.5s ease-out 0.5s both;
      pointer-events: none;
    }

    .ac-burst-ring:nth-child(2) {
      animation-delay: 0.8s;
    }

    .ac-burst-ring:nth-child(3) {
      animation-delay: 1.1s;
    }

    @keyframes acBurstRing {
      0% {
        width: 0;
        height: 0;
        opacity: 0.8;
      }

      100% {
        width: 900px;
        height: 900px;
        opacity: 0;
      }
    }

    @keyframes acArcDraw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes acStarPop {
      from {
        opacity: 0;
        transform: scale(0);
        transform-origin: 235px 47px
      }

      to {
        opacity: 1;
        transform: scale(1);
        transform-origin: 235px 47px
      }
    }

    .ac-scroll-hint {
      position: absolute;
      bottom: 16px;
      right: 24px;
      font-size: 0.7rem;
      color: var(--navy);
      opacity: 0.35;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      writing-mode: vertical-rl;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Lato', sans-serif;
      color: #222;
      background: #fff;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(230, 81, 0, 0.3);
      }

      50% {
        box-shadow: 0 0 0 12px rgba(230, 81, 0, 0);
      }
    }

    @keyframes logoIn {
      from {
        opacity: 0;
        transform: scale(0.7) rotate(-8deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    .anim-fadeup {
      animation: fadeUp 0.7s ease forwards;
    }

    .anim-float {
      animation: float 3s ease-in-out infinite;
    }

    .anim-logo {
      animation: logoIn 0.8s cubic-bezier(.34, 1.56, .64, 1) forwards;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 40px;
      border-bottom: 1.5px solid #eee;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .nav-logo img {
      height: 58px;
      width: auto;
      object-fit: contain;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    nav ul a {
      text-decoration: none;
      color: #333;
      font-size: 0.9rem;
      font-weight: 600;
      transition: color 0.2s;
      cursor: pointer;
    }

    nav ul a:hover {
      color: #1a237e;
    }

    .nav-cta {
      background: #1a237e !important;
      color: #fff !important;
      padding: 8px 18px;
      border-radius: 4px;
    }

    .nav-admin {
      color: #bbb !important;
      font-size: 0.78rem !important;
      font-weight: 400 !important;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 70px 40px 60px;
      max-width: 1100px;
      margin: 0 auto;
      gap: 40px;
    }

    .hero-text h1 {
      font-family: 'Merriweather', serif;
      font-size: 2.2rem;
      line-height: 1.4;
      color: #1a237e;
      max-width: 500px;
    }

    .hero-text p {
      margin-top: 16px;
      font-size: 1rem;
      color: #555;
      max-width: 440px;
      line-height: 1.75;
    }

    .hero-btns {
      margin-top: 28px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: #e65100;
      color: #fff;
      padding: 13px 28px;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
      animation: pulse 2.5s ease infinite;
    }

    .btn-primary:hover {
      background: #bf360c;
    }

    .btn-outline {
      background: transparent;
      color: #1a237e;
      padding: 13px 28px;
      border: 2px solid #1a237e;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }

    .btn-outline:hover {
      background: #1a237e;
      color: #fff;
    }

    .hero-img img {
      width: 340px;
      height: 260px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
    }

    .stats {
      background: #1a237e;
      color: #fff;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .stat-item {
      text-align: center;
      padding: 28px 16px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-item strong {
      display: block;
      font-size: 1.9rem;
      font-family: 'Merriweather', serif;
    }

    .stat-item span {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 4px;
      display: block;
    }

    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 40px;
    }

    .section-title {
      font-family: 'Merriweather', serif;
      font-size: 1.7rem;
      color: #1a237e;
      margin-bottom: 8px;
    }

    .section-sub {
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 36px;
    }

    .divider {
      border: none;
      border-top: 1.5px solid #eee;
      max-width: 1100px;
      margin: 0 auto;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 860px;
    }

    .gallery-card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
    }

    .gallery-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }

    .gallery-card:hover img {
      transform: scale(1.03);
    }

    .gallery-caption {
      padding: 10px 14px;
      background: #f5f7ff;
      font-size: 0.82rem;
      color: #666;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .course-card {
      border: 1.5px solid #ddd;
      border-radius: 10px;
      padding: 24px 20px;
      transition: all 0.2s;
    }

    .course-card:hover {
      border-color: #1a237e;
      box-shadow: 0 4px 20px rgba(26, 35, 126, 0.1);
      transform: translateY(-2px);
    }

    .badge {
      display: inline-block;
      background: #e8eaf6;
      color: #1a237e;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .course-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #1a237e;
      margin-bottom: 6px;
    }

    .course-card p {
      font-size: 0.87rem;
      color: #666;
      line-height: 1.6;
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .why-card {
      padding: 24px;
      background: #f5f7ff;
      border-radius: 8px;
      border-left: 4px solid #1a237e;
      transition: transform 0.2s;
    }

    .why-card:hover {
      transform: translateX(4px);
    }

    .why-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #1a237e;
      margin-bottom: 8px;
    }

    .why-card p {
      font-size: 0.87rem;
      color: #555;
      line-height: 1.6;
    }

    .faculty-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .faculty-card {
      border: 1.5px solid #eee;
      border-radius: 10px;
      padding: 24px 16px;
      text-align: center;
      transition: all 0.2s;
    }

    .faculty-card:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      transform: translateY(-3px);
    }

    .faculty-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      margin: 0 auto 14px;
      border: 3px solid #c5cae9;
      overflow: hidden;
      background: #e8eaf6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .faculty-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .faculty-card h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1a237e;
    }

    .faculty-prev {
      font-size: 0.75rem;
      color: #e65100;
      font-weight: 600;
      margin: 5px 0 4px;
    }

    .faculty-card p {
      font-size: 0.8rem;
      color: #888;
    }

    .contact-wrap {
      display: flex;
      gap: 50px;
      flex-wrap: wrap;
    }

    .contact-info {
      flex: 1;
      min-width: 240px;
    }

    .contact-info p {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.9;
      margin-bottom: 12px;
    }

    .contact-info strong {
      color: #222;
    }

    .contact-info a {
      color: #1a237e;
      text-decoration: none;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .contact-form {
      flex: 2;
      min-width: 260px;
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: 'Lato', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }

    .contact-form input:focus,
    .contact-form select:focus,
    .contact-form textarea:focus {
      border-color: #1a237e;
    }

    .contact-form textarea {
      height: 100px;
      resize: vertical;
    }

    .contact-form button {
      background: #1a237e;
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Lato', sans-serif;
      transition: background 0.2s;
      width: 100%;
    }

    .contact-form button:hover {
      background: #283593;
    }

    .contact-form button:disabled {
      background: #9fa8da;
      cursor: not-allowed;
    }

    .wa-float {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #25d366;
      color: #fff;
      border-radius: 50px;
      padding: 12px 20px;

  <script>
    // ── Hero Particles
    (function () {
      const particleColors = ['#E8651A', '#1B3D6E', '#F4A460', '#FFB347'];
      const pg = document.getElementById('acParticles');
      for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'ac-particle';
        const size = Math.random() * 80 + 20;
        p.style.cssText = `width:${size}px;height:${size}px;background:${particleColors[Math.floor(Math.random() * particleColors.length)]};left:${Math.random() * 100}%;animation-duration:${Math.random() * 12 + 8}s;animation-delay:${Math.random() * 8}s;`;
        pg.appendChild(p);
      }

      // ── Flying words
      const words = ['ज्ञान', 'Wisdom', 'Learn', 'Grow', 'Excel', 'उड़ान', 'सफलता', 'Think', 'Dream', 'Achieve', 'शिक्षा', 'Rise', 'Inspire', 'Lead'];
      const wc = document.getElementById('acWordsContainer');
      function spawnWord() {
        const w = document.createElement('div');
        w.className = 'ac-flying-word';
        const size = Math.random() * 18 + 12;
        const startX = 30 + Math.random() * 40;
        const startY = 30 + Math.random() * 20;
        const angle = (Math.random() - 0.5) * 60;
        const dx = (Math.random() - 0.4) * 300 + 'px';
        const dy = -(Math.random() * 250 + 100) + 'px';
        w.textContent = words[Math.floor(Math.random() * words.length)];
        w.style.cssText = `left:${startX}%;top:${startY}%;font-size:${size}px;--r:${angle}deg;--dx:${dx};--dy:${dy};animation-duration:${Math.random() * 3 + 4}s;animation-delay:${Math.random() * 2}s;`;
        wc.appendChild(w);
        setTimeout(() => w.remove(), 7000);
      }
      setInterval(spawnWord, 600);
      for (let i = 0; i < 5; i++) setTimeout(spawnWord, i * 400);

      // ── Counter animation
      function countUp(el, target, suffix, duration) {
        duration = duration || 2000;
        let start = 0;
        const step = target / (duration / 16);
        const timer = setInterval(() => {
          start += step;
          if (start >= target) { clearInterval(timer); el.textContent = target + suffix; return; }
          el.textContent = Math.floor(start) + suffix;
        }, 16);
      }
      setTimeout(() => {
        countUp(document.getElementById('acS1'), 5000, '+');
        countUp(document.getElementById('acS2'), 120, '+');
        countUp(document.getElementById('acS3'), 98, '%');
      }, 1200);
    })();

    // ── Burst + scroll to contact on Enroll click
    function acTriggerBurst(e) {
      e.preventDefault();
      for (let i = 0; i < 8; i++) {
        const bird = document.createElement('div');
        bird.style.cssText = `position:fixed;top:50%;left:50%;font-size:${Math.random() * 20 + 12}px;color:#E8651A;pointer-events:none;font-weight:700;font-family:'Rajdhani',sans-serif;z-index:9999;transition:all 1.5s ease;`;
        bird.textContent = ['🦅', '✨', '★', 'Learn', 'Grow', 'उड़ान'][Math.floor(Math.random() * 6)];
        document.body.appendChild(bird);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          bird.style.transform = `translate(${(Math.random() - 0.5) * 400}px, ${-(Math.random() * 300 + 100)}px) scale(1.5)`;
          bird.style.opacity = '0';
        }));
        setTimeout(() => bird.remove(), 1600);
      }
      // Scroll to enquiry section after burst animation
      setTimeout(() => {
        const target = document.getElementById('contact');
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      }, 400);
    }
  </script>

    function Contact() {
      const [form, setForm] = useState({ name: '', parent: '', phone: '', cls: '', course: '', msg: '' });
      const [status, setStatus] = useState(null);
      const [loading, setLoading] = useState(false);
      const upd = (k, v) => setForm(f => ({ ...f, [k]: v }));

      const submit = async () => {
        if (!form.name || !form.parent || !form.phone || !form.cls || !form.course) {
          setStatus({ t: 'error', m: 'Please fill in all required fields.' }); return;
        }
        setLoading(true);
        setStatus({ t: 'info', m: 'Sending your enquiry...' });
        try {
          await sb.from('inquiries').insert({ student_name: form.name, parent_name: form.parent, parent_phone: form.phone, student_class: form.cls, course_interest: form.course, message: form.msg || '' });
          await emailjs.send("service_3f4hkyq", "template_92qucyy", { student_name: form.name, parent_name: form.parent, parent_phone: form.phone, student_class: form.cls, course_interest: form.course, message: form.msg || 'No message', to_email: 'adhyayan.maths10794@gmail.com' });
          setStatus({ t: 'success', m: 'Enquiry sent! We will contact you within 24 hours.' });
          setForm({ name: '', parent: '', phone: '', cls: '', course: '', msg: '' });
        } catch (e) {
          setStatus({ t: 'error', m: 'Could not send. Please call: +91 91409 13384' });
        }
        setLoading(false);
      };

      const msgStyle = status ? {
        display: 'block', padding: '12px 16px', borderRadius: '6px', fontSize: '0.9rem', marginTop: '12px',
        background: status.t === 'success' ? '#e8f5e9' : status.t === 'error' ? '#fff3e0' : '#e3f2fd',
        borderLeft: `4px solid ${status.t === 'success' ? '#2e7d32' : status.t === 'error' ? '#e65100' : '#1565c0'}`,
        color: status.t === 'success' ? '#1b5e20' : status.t === 'error' ? '#bf360c' : '#0d47a1'
      } : { display: 'none' };

      return (
        <div className="section" id="contact">
          <h2 className="section-title">Get in Touch</h2>
          <p className="section-sub">Fill the form or call/WhatsApp us directly</p>
          <div className="contact-wrap">
            <div className="contact-info">
              <p><strong>Address</strong><br />Nandani Bal Niketan,<br />Central Jail Road, Sikraul,<br />Shivpur, Varanasi</p>
              <p><strong>Phone / WhatsApp</strong><br /><a href="tel:+919140913384">+91 91409 13384</a><br /><a href="tel:+918427409797">+91 84274 09797</a></p>
              <p><strong>Email</strong><br /><a href="mailto:adhyayan.maths10794@gmail.com">adhyayan.maths10794@gmail.com</a></p>
              <p><strong>Timings</strong><br />Mon – Sat: 7 AM – 8 PM<br />Sunday: Doubt Sessions Only</p>
            </div>
            <div className="contact-form">
              <input value={form.name} onChange={e => upd('name', e.target.value)} placeholder="Student Name *" />
              <input value={form.parent} onChange={e => upd('parent', e.target.value)} placeholder="Parent Name *" />
              <input value={form.phone} onChange={e => upd('phone', e.target.value)} placeholder="Parent Phone / WhatsApp *" />
              <select value={form.cls} onChange={e => upd('cls', e.target.value)}>
                <option value="">Select Class *</option>
                {['Class 9', 'Class 10', 'Class 11', 'Class 12'].map(c => <option key={c}>{c}</option>)}
              </select>
              <select value={form.course} onChange={e => upd('course', e.target.value)}>
                <option value="">Course Interest *</option>
                {['Pre-Foundation (9th and 10th)', 'Engineering Entrance (11th and 12th)', 'Medical Entrance (11th and 12th)'].map(c => <option key={c}>{c}</option>)}
              </select>
              <textarea value={form.msg} onChange={e => upd('msg', e.target.value)} placeholder="Any message? (optional)" />
              <button onClick={submit} disabled={loading}>{loading ? 'Sending...' : 'Send Enquiry'}</button>
              <div style={msgStyle}>{status?.m}</div>
            </div>
          </div>
        </div>
      );
    }
